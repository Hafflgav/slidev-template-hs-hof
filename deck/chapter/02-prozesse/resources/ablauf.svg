<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#000000">
  <title>Ablauf in drei Schritten</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <g fill="none" stroke="#000000" stroke-width="3" marker-end="url(#pfeil)">
    <path d="M150,110 V150"/>
    <path d="M150,260 V300"/>
  </g>
  <rect x="30" y="10" width="240" height="100" rx="14" fill="#F0F5F8" stroke="#000000" stroke-width="3"/>
  <text x="150" y="69" text-anchor="middle">Prüfen</text>
  <rect x="30" y="160" width="240" height="100" rx="14" fill="#F0F5F8" stroke="#000000" stroke-width="3"/>
  <text x="150" y="219" text-anchor="middle">Entscheiden</text>
  <rect x="30" y="310" width="240" height="100" rx="14" fill="#F0F5F8" stroke="#000000" stroke-width="3"/>
  <text x="150" y="369" text-anchor="middle">Abschließen</text>
</svg>
