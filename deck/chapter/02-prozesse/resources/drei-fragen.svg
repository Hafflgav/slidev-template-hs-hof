<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" font-family="Arial, Helvetica, sans-serif" font-size="22">
  <title>Zielgruppe, Frage und Detailgrad überlappen</title>
  <rect x="20" y="20" width="200" height="200" fill="#FECE00"/>
  <rect x="160" y="120" width="200" height="200" fill="#0BDA7D" style="mix-blend-mode: multiply"/>
  <rect x="60" y="240" width="200" height="200" fill="#2962FA" style="mix-blend-mode: multiply"/>
  <text x="36" y="54" fill="#000000">Zielgruppe</text>
  <text x="246" y="166" fill="#000000">Frage</text>
  <text x="76" y="420" fill="#FFFFFF">Detailgrad</text>
</svg>
